<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SkillMatch é uma aplicação que compara as habilidades de candidatos com vagas de desenvolvimento front-end."
    >

    <title>SkillMatch | Compatibilidade com vagas</title>

    <link
        rel="stylesheet"
        href="./assets/styles/index.style.css"
    >
</head>

<body>
    <header class="cabecalho">
        <nav class="navegacao" aria-label="Navegação principal">
            <a href="#inicio" class="logo-link">
                <img
                    src="./assets/img/logo.svg"
                    alt="Logotipo do SkillMatch"
                    class="logo"
                >
            </a>

            <a href="#perfil">Analisar perfil</a>
        </nav>
    </header>

    <main id="inicio">
        <section class="apresentacao" aria-labelledby="titulo-principal">
            <h1 id="titulo-principal">Encontre a vaga mais compatível com seu perfil</h1>

            <p>
                Informe suas habilidades e descubra quais oportunidades
                combinam melhor com seu conhecimento.
            </p>
        </section>

        <section id="perfil" class="secao-perfil" aria-labelledby="titulo-perfil">
            <h2 id="titulo-perfil">Perfil do candidato</h2>

            <form id="formulario-perfil" novalidate>
                <div class="grupo-campo">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        autocomplete="name"
                        aria-describedby="erro-nome"
                        required
                    >

                    <span
                        id="erro-nome"
                        class="mensagem-erro"
                        aria-live="polite"
                    ></span>
                </div>

                <div class="grupo-campo">
                    <label for="area">Área de interesse</label>

                    <input
                        type="text"
                        id="area"
                        name="area"
                        placeholder="Ex.: Front-end"
                        aria-describedby="erro-area"
                        required
                    >

                    <span
                        id="erro-area"
                        class="mensagem-erro"
                        aria-live="polite"
                    ></span>
                </div>

                <div class="grupo-campo">
                    <label for="habilidades">
                        Habilidades
                    </label>

                    <input
                        type="text"
                        id="habilidades"
                        name="habilidades"
                        placeholder="Ex.: HTML, CSS, JavaScript"
                        aria-describedby="ajuda-habilidades"
                        required
                    >

                    <small id="ajuda-habilidades">
                        Separe as habilidades por vírgulas.
                    </small>

                    <span
                        id="erro-habilidades"
                        class="mensagem-erro"
                        aria-live="polite"
                    ></span>
                </div>

                <div class="grupo-campo">
                    <label for="experiencia">
                        Experiência em meses
                    </label>

                    <input
                        type="number"
                        id="experiencia"
                        name="experiencia"
                        min="0"
                        value="0"
                        aria-describedby="erro-experiencia"
                        required
                    >

                    <span
                        id="erro-experiencia"
                        class="mensagem-erro"
                        aria-live="polite"
                    ></span>
                </div>

                <button type="submit">
                    Analisar compatibilidade
                </button>
            </form>
        </section>

        <section
            id="resultados"
            class="secao-resultados"
            aria-labelledby="titulo-resultados"
        >
            <h2 id="titulo-resultados">Vagas encontradas</h2>

            <p
                id="mensagem-status"
                class="mensagem-status"
                aria-live="polite"
            ></p>

            <div id="destaque-melhor-vaga"></div>

            <div
                id="lista-vagas"
                class="lista-vagas"
                aria-live="polite"
            ></div>
        </section>
    </main>

    <footer class="rodape">
        <p>
            SkillMatch — Projeto desenvolvido com HTML, CSS e JavaScript.
        </p>
    </footer>

    <script
        type="module"
        src="./assets/scripts/main.js"
    ></script>
</body>
</html>
